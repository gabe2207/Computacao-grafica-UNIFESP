<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pong</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: #101010; color: #fff; font: 16px system-ui, sans-serif; text-align: center; }
        main { max-width: 600px; margin: auto; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        #placar { font-size: 32px; font-weight: bold; }
        canvas { display: block; width: 100%; height: auto; border: 1px solid #777; margin: 16px auto; }
        button { font: inherit; padding: 10px 18px; cursor: pointer; }
        p { line-height: 1.6; }
    </style>
</head>
<body>
    <main>
        <h1>Pong</h1>
        <div id="placar" aria-label="Placar: esquerda e direita" aria-live="polite">0 × 0</div>
        <canvas id="canvas" width="600" height="600" aria-label="Campo de Pong para dois jogadores">Seu navegador precisa suportar WebGL 2.</canvas>
        <p>Barra esquerda: <strong>W / S</strong> · Barra direita: <strong>↑ / ↓</strong><br>A bola volta ao centro após cada gol.</p>
        <button id="reiniciar" type="button">Reiniciar partida</button>
    </main>
    <script src="m3.js"></script>
    <script src="main.js"></script>
</body>
</html>
